example:
  input: Se pregunta por puentes etiquetados en un río ficticio, sin nombres de personas.
  steps:
  - Guarda el texto de la consulta y la fecha.
  - Compara un objeto con una ortofoto, no con una dirección particular.
  expected: La nota lista objetos y dice cuáles no se contrastaron.
  interpretation: Una etiqueta no prueba que el objeto siga igual.
steps:
- Dibuja una zona pequeña y elige un tipo de objeto.
- Exporta o copia la consulta, no solo la imagen.
- Contrasta con otra fuente antes de afirmar que el objeto existe.
