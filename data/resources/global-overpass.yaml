url: https://overpass-turbo.eu/
purpose: Consultar objetos de OpenStreetMap con una pregunta geográfica, sin tratar el resultado como mapa oficial.
inputs:
- zona
- tipo de objeto
outputs:
- geometrías y etiquetas de OpenStreetMap
- consulta utilizada
usage: Guarda la consulta y la fecha. Contrasta los objetos con una fuente primaria o una ortofoto fechada.
interpretation: El resultado es lo que la comunidad ha etiquetado. Puede estar incompleto o recién editado.
limitations: Overpass no crea datos nuevos. Lee OpenStreetMap. No es una fuente oficial ni una imagen.
