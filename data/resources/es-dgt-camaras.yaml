purpose: Consultar el punto de acceso nacional de tráfico para localizar cámaras y datos de la red que publica la DGT.
inputs:
- carretera
- fecha de consulta
outputs:
- localización de cámaras publicadas
- imagen o dato de tráfico si el servicio lo muestra
usage: Anota la carretera, la hora de la imagen y que es una cámara de tráfico.
interpretation: La imagen muestra la calzada en ese momento de captura. No identifica a una persona ni prueba un hecho.
limitations: Esta ficha no es la estadística de DGT en cifras. Una cámara no es un censo de vehículos ni una
  prueba. La cobertura autonómica que a veces se afirma quedó sin contrastar. La cadencia no se leyó en el servicio.
