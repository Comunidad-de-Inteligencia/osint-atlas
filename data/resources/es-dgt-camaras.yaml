  steps:
  - Anota carretera y hora de la captura.
  - No identifiques vehículos ni personas.
  expected: La nota dice la hora y que la imagen no prueba un incidente.
  interpretation: Sirve para ver el estado publicado de la calzada, no para investigar a alguien.
steps:
- Abre el punto de acceso y localiza la carretera.
- Anota la hora de la imagen, no la hora en que tú miras.
- No uses la captura para identificar a una persona.
