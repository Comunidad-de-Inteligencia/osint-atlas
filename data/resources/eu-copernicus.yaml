usage: Registrar misión, producto, fecha, cobertura nubosa y transformación aplicada.
interpretation: Una imagen necesita contexto temporal, resolución y corroboración.
limitations: El navegador y el Data Space no son la misma pantalla. Cifras que circulan, y que esta ficha no
  contrastó en el servicio, sitúan Sentinel-1 y Sentinel-2 en torno a un día, y Sentinel-3 y Sentinel-5P
  en torno a tres horas. Son orientativas. La posición de un satélite o un globo no es la imagen en
  directo. EU marca el programa europeo. GLOBAL se conserva porque las escenas pueden consultarse para
  lugares de fuera de la Unión; si se quitara, dejarían de aparecer en esos territorios. Las licencias de
  productos de terceros pueden ser distintas.
