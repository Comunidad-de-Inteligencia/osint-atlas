example:
  input: Una imagen ficticia de un cruce sin personas se compara con una cartografía fechada.
  steps:
  - Registrar misión, producto, fecha, cobertura nubosa y transformación aplicada.
  - Anota la consulta, sus filtros y la fecha. En esta práctica no envíes solicitudes, reportes ni datos
    personales.
  expected: Se anotan dos rasgos concordantes y las diferencias. La coincidencia se expresa como hipótesis,
    sin localizar personas.
  interpretation: Una imagen necesita contexto temporal, resolución y corroboración.
steps:
- Registrar misión, producto, fecha, resolución, latencia y cobertura nubosa.
- No uses la posición del satélite ni un globo como si fueran la imagen.
- Comprueba en Copernicus Data Space Ecosystem la fecha, cobertura y definición de imágenes satelitales.
- Si no hay coincidencias, registra los filtros utilizados y consulta los límites antes de extraer conclusiones.
