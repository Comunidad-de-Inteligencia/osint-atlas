- Buscar la sociedad y ordenar los actos por fecha; conservar el identificador y el enlace al anuncio.
- Comprueba en Boletín Oficial del Registro Mercantil la fecha, cobertura y definición de actos societarios.
- Si no hay coincidencias, registra los filtros utilizados y consulta los límites antes de extraer conclusiones.
