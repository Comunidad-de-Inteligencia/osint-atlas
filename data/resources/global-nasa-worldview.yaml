purpose: Explorar capas de observación de la Tierra de NASA, con fecha, para comparar una escena amplia.
inputs:
- zona
- fecha
- capa
outputs:
- vista de una capa fechada
- nombre de la capa
usage: Anota la capa y el día. No la trates como un callejero ni como tiempo real.
interpretation: La vista muestra el producto elegido en esa fecha. No es la imagen de un satélite que pasa ahora.
limitations: Cada capa tiene su propia resolución y retraso, no contrastados aquí. El globo del visor no es
  una fotografía en directo.
