steps:
- Confirmar disponibilidad nacional y combinar con la denuncia inmediata ante la policía.
- Comprueba en Línea europea para menores desaparecidos la fecha, cobertura y definición de asistencia
  y derivación.
- Si no hay coincidencias, registra los filtros utilizados y consulta los límites antes de extraer conclusiones.
