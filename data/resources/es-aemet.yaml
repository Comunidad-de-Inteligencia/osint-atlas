steps:
- Guardar identificador de producto, estación, periodo y momento de consulta.
- Comprueba en AEMET OpenData la fecha, cobertura y definición de observaciones.
- Si no hay coincidencias, registra los filtros utilizados y consulta los límites antes de extraer conclusiones.
