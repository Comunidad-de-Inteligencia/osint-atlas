steps:
- Localizar la parcela y contrastar su geometría con cartografía y ortofotos.
- Comprueba en Sede Electrónica del Catastro la fecha, cobertura y definición de parcela.
- Si no hay coincidencias, registra los filtros utilizados y consulta los límites antes de extraer conclusiones.
