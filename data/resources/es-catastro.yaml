  input: Una imagen ficticia de un cruce sin personas se compara con una cartografía fechada.
  steps:
  - Localizar la parcela y contrastar su geometría con cartografía y ortofotos.
  - Anota la consulta, sus filtros y la fecha. En esta práctica no envíes solicitudes, reportes ni datos
    personales.
  expected: Se anotan dos rasgos concordantes y las diferencias. La coincidencia se expresa como hipótesis,
    sin localizar personas.
  interpretation: La referencia catastral describe un inmueble, pero no prueba por sí sola titularidad
