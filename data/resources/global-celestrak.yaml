example:
  input: Se localiza un satélite ficticio de observación y se anota solo su época orbital.
  steps:
  - Copia el nombre del conjunto y la época.
  - No afirmes que la imagen de fondo es de ese satélite.
  expected: La nota separa la posición estimada de cualquier escena.
  interpretation: CelesTrak dice por dónde puede ir el satélite. No entrega su fotografía.
steps:
- Busca el satélite por su nombre público.
- Anota la época del elemento.
- Si comparas con una imagen, usa la ficha de esa imagen y su fecha.
