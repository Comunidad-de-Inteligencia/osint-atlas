purpose: Consultar elementos orbitales públicos para estimar dónde está un satélite, no qué imagen toma.
inputs:
- nombre del satélite
- fecha
outputs:
- elementos orbitales
- época del elemento
usage: Anota el nombre del conjunto y la época. No dibujes esa posición como si fuera una foto.
interpretation: Un marcador orbital es una estimación de posición. No es la escena que captura el satélite.
limitations: La propagación tiene error. La época puede estar desfasada. No sirve para decir que se ve el
  suelo en directo.
