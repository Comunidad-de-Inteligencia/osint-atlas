example:
  input: Se compara una mancha de nubes ficticia sobre una costa sin nombres de personas.
  steps:
  - Anota satélite, producto y hora de la escena.
  - No envíes solicitudes ni datos personales en esta práctica.
  expected: Queda anotada la hora y que la mancha no localiza un cruce.
  interpretation: La imagen meteorológica no sustituye una ortofoto ni un aviso local.
steps:
- Elige zona y producto y anota la hora que muestra el visor.
- Compara con un aviso meteorológico oficial si la pregunta es de emergencia.
- Si la escena no cubre la hora buscada, dilo y no completes el hueco.
