purpose: Ver imágenes meteorológicas de EUMETSAT para seguir nubes, tormentas o humo a escala amplia.
inputs:
- zona
- hora
- producto
outputs:
- imágenes meteorológicas
- hora de la escena
usage: Anota el satélite, el producto y la hora. No la uses como mapa de calles.
interpretation: Sirve para el tiempo y para fenómenos grandes. No identifica una calle ni una persona.
limitations: EUROPE marca al publicador europeo. GLOBAL se conserva porque la imagen puede consultarse
  desde otros lugares; si se quitara, dejaría de aparecer fuera de Europa. La cadencia que se cita en
  guías no se contrastó aquí. Una vista meteorológica no es una ortofoto.
