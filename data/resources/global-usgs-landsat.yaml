usage: Anota sensor, fecha y nivel de producto. El visor LandsatLook es una puerta distinta de la página de la misión.
interpretation: Una escena Landsat tiene fecha y resolución. No es una imagen en directo ni una ortofoto nacional.
limitations: El organismo está en Estados Unidos y el catálogo no tiene nodo de ese país. GLOBAL se mantiene
  porque las escenas cubren otros territorios. La licencia y el retraso de cada producto siguen pendientes.
