purpose: Consultar el sistema europeo de información sobre incendios forestales como panorama de fuegos.
inputs:
- zona
- fecha
- tipo de aviso
outputs:
- perímetros o puntos de incendio publicados
- fecha del producto
usage: Cita la fecha del producto y la zona. No lo uses como orden de evacuación.
interpretation: Un punto de incendio es un aviso del sistema, no la prueba de un hecho ni la imagen en directo.
limitations: No todos los fuegos aparecen. La latencia no se contrastó en el servicio. El aviso no sustituye
  a protección civil ni a los bomberos.
