example:
  input: Un ejercicio ficticio busca si un monte sin habitantes figura en el mapa de incendios de un día concreto.
  steps:
  - Anota la fecha del producto y el nombre de la capa.
  - No emitas un aviso ni contactes con servicios reales.
  expected: Se distingue un punto publicado de la ausencia de punto. La ausencia no prueba que no haya fuego.
  interpretation: EFFIS orienta. La autoridad local confirma la situación.
steps:
- Fija la zona y el día antes de leer el mapa.
- Anota el nombre del producto y su fecha.
- Si no hay marca, dilo como ausencia en esa capa, no como ausencia del fuego.
