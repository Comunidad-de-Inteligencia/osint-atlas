usage: Anota la cámara y la hora. La ficha municipal consultada habla de una captura cada cinco minutos.
interpretation: La imagen sirve para ver el tráfico en ese punto. No identifica a una persona ni prueba un hecho.
limitations: El propio conjunto dice que las cámaras están para conocer el tráfico y los eventos que afectan
  a la movilidad. Una captura cada cinco minutos, según esa página, no es un vídeo continuo. No cubre otras ciudades.
