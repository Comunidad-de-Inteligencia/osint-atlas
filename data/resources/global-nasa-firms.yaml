usage: Anota sensor, fecha y confianza si el visor la muestra. Contrasta con una fuente local.
interpretation: Una detección es una anomalía térmica del sensor. No prueba por sí sola un incendio ni su causa.
limitations: Pueden faltar fuegos pequeños o bajo nube, según el sensor. La cifra de retraso no se contrastó
