name: Propose a source
description: Suggest a public source without cases or personal data.
title: "Source: "
labels: [candidate]
body:
  - type: markdown
    attributes:
      value: "Do not include personal data, real investigations, or links to sensitive or illegal content."
  - type: input
    id: official_url
    attributes:
      label: Official page
      description: HTTPS link of the responsible body or service.
    validations:
      required: true
  - type: input
    id: jurisdiction
    attributes:
      label: Territory
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What it is for
      description: Explain inputs, the expected result, and known limits.
    validations:
      required: true
