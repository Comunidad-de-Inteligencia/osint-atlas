name: Mantenimiento diario

on:
  workflow_dispatch:
  # Active esta agenda después de validar el flujo, asignar revisores y revisar cuotas:
  # schedule:
  #   - cron: "17 4 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python tools/check_links.py --scope critical --timeout 10 --delay 1 --workers 3 --output reports/critical-links.json
      - run: uv run python tools/check_reviews.py --output reports/stale-reviews.json
      - name: Preparar etiquetas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create maintenance --color 1D76DB --description "Revisión generada por mantenimiento" --force
          gh label create critical-review --color B60205 --description "Revisión de recurso crítico" --force
      - name: Agrupar avisos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python tools/publish_maintenance_issue.py reports/critical-links.json --title "Revisar disponibilidad de recursos críticos" --label critical-review
          uv run python tools/publish_maintenance_issue.py reports/stale-reviews.json --title "Revisiones editoriales vencidas" --label maintenance
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-daily-${{ github.run_id }}
          path: reports/*.json
          retention-days: 7
