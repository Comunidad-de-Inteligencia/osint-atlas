name: Descubrimiento mensual
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar únicamente estado técnico y propuestas de revisión
        type: boolean
        default: false
  # Agenda desactivada hasta confirmar resultados manuales, cuotas y límite de gasto.
  # schedule:
  #   - cron: "43 4 1 * *"
permissions:
  contents: read
concurrency:
  group: atlas-maintenance-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Recuperar el historial anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python tools/fetch_state.py
      - name: Recoger observaciones sin permisos de escritura
        run: |
          uv run python tools/discover_candidates.py --output reports/observations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: collect
    if: ${{ always() && (inputs.publish || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
      - name: Publicar únicamente informes y propuestas
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          uv run python tools/publish_maintenance_issue.py reports/observations.json --publish
          if test -f reports/stale-reviews.json; then
            uv run python tools/publish_maintenance_issue.py reports/stale-reviews.json --label editorial-review --publish
          fi
          uv run python tools/publish_state.py reports/state.json --publish
